<!DOCTYPE html>
<html>
<head>
    <title>Simple Navigation Layout</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #f4f6f8;
        }

        .main-box {
            width: 85%;
            margin: 30px auto;
            border: 3px solid #444;
            padding: 15px;
            border-radius: 10px;
            background-color: #ffffff;
        }

        .top-header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
        }

        .top-header span {
            color: yellow;
            font-weight: bold;
        }

        .menu-one, .menu-two {
            margin-top: 15px;
            text-align: center;
        }

        .menu-one a, .menu-two a {
            text-decoration: none;
            padding: 10px 15px;
            margin: 6px;
            display: inline-block;
            border-radius: 5px;
            font-weight: bold;
        }

        .menu-one a {
            background-color: #87cefa;
            color: black;
        }

        .menu-two a {
            background-color: #90ee90;
            color: black;
        }

        .menu-one a:hover {
            background-color: #1e90ff;
            color: white;
        }

        .menu-two a:hover {
            background-color: #2e8b57;
            color: white;
        }
    </style>
</head>

<body>

    <div class="main-box">

        <div class="top-header">
            Welcome to <span>My Site</span>
        </div>

        <div class="menu-one">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Our Work</a>
            <a href="#">Contact</a>
        </div>

        <div class="menu-two">
            <a href="#">Account</a>
            <a href="#">Settings</a>
            <a href="#">Notifications</a>
            <a href="#">Sign Out</a>
        </div>

    </div>

</body>
</html>
